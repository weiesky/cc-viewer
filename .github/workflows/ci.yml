name: CI

on:
  push:
    branches:
      - main
      - test/**
      - fix/**
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          # 24: test infrastructure uses node:module registerHooks (sync hooks, Node 22.15+)
          node-version: 24
          cache: 'pnpm'
      # -logger shell hook tests need real zsh (not included in ubuntu runner by default)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # --ignore-scripts (supply-chain hardening; retained) skips native compilation and
      # bypasses the allowBuilds allowlist; cli/PTY tests need node-pty, so rebuild it explicitly
      - run: pnpm rebuild node-pty
      # Static serving / SSR injection tests need real dist/
      - run: pnpm run build
      # L4: the published tarball's physical layout is a public contract — diff the
      # dry-run pack file list against the committed baseline (scripts/tarball-baseline.json)
      - run: pnpm run verify:tarball
      # Import-boundary gate: layering classes + no static cycles inside packages/app
      # (also wired into all pretest* hooks; explicit here for visibility)
      - run: pnpm run verify:boundaries
      # Full suite: fast unit tier + the CCV_TEST_CLI-gated CLI/server integration tier
      # (a superset of `pnpm test`, which developers use for the fast local loop).
      - run: pnpm run test:cli
