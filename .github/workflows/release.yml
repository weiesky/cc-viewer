name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          # Windows images have fully rolled to VS2026 (windows-2025 no longer ships VS2022).
          # Old node-gyp 11.x doesn't recognize VS2026 → "Could not find any Visual Studio
          # installation". Fix: force node-gyp ^12.1.0 via package.json overrides (12.1+
          # supports VS2026; @electron/rebuild's bundled ^11.2 can't reach it, so an override
          # is required). Keep the image pinned to windows-2025 to avoid windows-latest
          # introducing new variables.
          - os: windows-2025
            platform: win
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # pnpm 11 requires Node >= 22.13 (Node 20 is no longer supported), so the
      # build job moves from Node 20 to Node 24.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      # A2: the Electron job runs on pnpm's default ISOLATED linker — verified end-to-end
      # (web build + electron-builder 26.15.3 dep collection from the .pnpm store both
      # work; 26.14+ fixed multi-package workspace collection). Do NOT switch this job to
      # nodeLinker: hoisted — hoisted drops per-package node_modules, which breaks
      # apps/web/build.js's vite path, and a plain-scalar `nodeLinker:` append here is a
      # YAML syntax error (colon). The axios/qs/node-gyp overrides this job used to
      # duplicate in package.json now live in pnpm-workspace.yaml; the pinned node-gyp
      # ^12.1.0 keeps the VS2026 Windows image building.
      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      - name: Assemble Electron staging
        # The root build above assembled packages/app/dist; this composes
        # apps/electron/stage (app payload + shell + generated package.json),
        # which the electron-builder steps below pack. Runs on every OS so each
        # matrix runner packs a fresh stage.
        run: node apps/electron/scripts/assemble-app.mjs

      - name: Build Electron (mac)
        if: matrix.platform == 'mac'
        # Apple notarization (notarytool) returns HTTP 403 when the Developer Agreement has
        # expired or is unsigned — unrelated to code. Tolerate the failure: mark only this step
        # as failed and skip the mac artifact, but do not block the entire release pipeline —
        # win/linux artifacts, GitHub Release, and Homebrew bump proceed as normal. Once the
        # agreement is re-signed at developer.apple.com, mac notarization and upload resume
        # automatically.
        continue-on-error: true
        timeout-minutes: 60
        run: pnpm --filter @ccv/electron exec electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: MUNC45J2DU

      - name: Build Electron (win)
        if: matrix.platform == 'win'
        run: pnpm --filter @ccv/electron exec electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment when Windows signing certificate is available:
          # CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Electron (linux)
        if: matrix.platform == 'linux'
        run: pnpm --filter @ccv/electron exec electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            apps/electron/electron-dist/*.dmg
            apps/electron/electron-dist/*.zip
            apps/electron/electron-dist/*.exe
            apps/electron/electron-dist/*.AppImage
          # Missing artifacts on win/linux are always a bug — fail loudly. Mac keeps
          # the tolerance: its build step is continue-on-error by design (expired
          # Developer Agreement breaks notarization, not code) and simply skips the
          # mac artifact.
          if-no-files-found: ${{ matrix.platform == 'mac' && 'ignore' || 'error' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create GitHub Release
        # The downstream Homebrew bump is handled by the bump-homebrew job via reusable
        # workflow chained call (see below), within the same run — no dependency on the
        # release:published event. Use the default GITHUB_TOKEN to create the Release; no PAT needed.
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish to npm via Trusted Publishing (OIDC). Requires the npm package to be
  # configured with a Trusted Publisher for weiesky/cc-viewer (Settings → Access →
  # Trusted Publishing on npmjs.com). No token needed — OIDC provides an ephemeral
  # automation token automatically.
  npm-publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write      # required for OIDC token exchange with npm
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # OIDC trusted publishing requires npm >= 11.5.1. Pin the tested CLI instead of
      # following `latest`: npm 12 changed `npm pack --json` from an array to an object
      # and broke the v1.8.0 release gate. Upgrade this deliberately with CI coverage.
      - run: npm install -g npm@11.19.0

      - run: pnpm install --frozen-lockfile

      # A2: the publishable package is packages/app (root is a private shell).
      # Build the web bundle + assemble packages/app/dist via the root build,
      # then `npm pack` in packages/app (prepack re-runs the guarded assemble —
      # idempotent) and publish the TARBALL: tarball publishes run no lifecycle
      # scripts, and --provenance still attests the tarball digest. npm publish
      # stays because OIDC trusted publishing is npm-only (pnpm has no support).
      - run: pnpm run build

      # L4: the tarball's physical layout is a public contract — diff the dry-run pack
      # file list against the committed baseline before the real pack ships it.
      - run: pnpm run verify:tarball

      # Fail loudly before packing if the tag and the app version drifted apart —
      # the publish step below addresses the tarball by version-derived name.
      - name: Verify tag matches packages/app version
        run: |
          PKG_VERSION=$(node -p "require('./packages/app/package.json').version")
          [ "$PKG_VERSION" = "${GITHUB_REF_NAME#v}" ] || { echo "::error::tag ${GITHUB_REF_NAME} != packages/app version ${PKG_VERSION}"; exit 1; }

      - run: cd packages/app && npm pack

      - run: npm publish "./packages/app/cc-viewer-${GITHUB_REF_NAME#v}.tgz" --provenance
        # GITHUB_REF_NAME is the tag (vX.Y.Z); ${...#v} strips the leading v — the
        # tgz name uses the app version, which the release process keeps in sync.

  # Post-release automatic Homebrew tap formula bump (reusable workflow, uses HOMEBREW_TAP_TOKEN).
  bump-homebrew:
    needs: publish
    # Explicit needs.publish.result: a custom if would drop the implicit success() gate,
    # causing this job to run even when publish fails (bumping a non-existent release).
    if: ${{ needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    uses: ./.github/workflows/bump-homebrew.yml
    with:
      version: ${{ github.ref_name }}   # vX.Y.Z; the callee strips the leading 'v'
    # Minimal permissions: only pass HOMEBREW_TAP_TOKEN explicitly (the only secret the
    # callee needs); avoid secrets: inherit which would dump all caller secrets
    # (CSC_*/APPLE_* etc.) into the child workflow.
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
